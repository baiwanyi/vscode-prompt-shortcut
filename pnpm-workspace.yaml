# pnpm 12 不再读取 package.json 的 pnpm 字段，构建脚本白名单必须写在这里（字段名为 allowBuilds）。
# esbuild 需要执行 postinstall 安装平台二进制；vsce-sign 与 keytar 供本地打包签名使用；
# unrs-resolver 是 eslint-import-resolver-typescript 的解析内核，需下载平台二进制。
allowBuilds:
    '@vscode/vsce-sign': true
    esbuild: true
    keytar: true
    unrs-resolver: true
